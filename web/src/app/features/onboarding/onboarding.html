<div class="splash-screen">

    <!-- Watercolour illustration -->
    <div class="illustration-wrapper">
        <img src="/dibujo.png" alt="Natacha y Lucas" class="illustration" />
    </div>

    <!-- Typography -->
    <div class="text-block">
        <p class="kicker">Bienvenidos a la boda de</p>
        <h1 class="wedding-title">Natacha y Lucas</h1>
        <div class="title-divider"></div>
        <p class="wedding-date">21 de Febrero de 2026</p>
    </div>

    <!-- Manual skip — outline ghost button, no solid fill -->
    <div class="cta-area">
        <button class="cta-button" (click)="goToApp()">
            <span class="cta-label">Entrar a la galería</span>
            <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

</div>
